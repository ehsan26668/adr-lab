name: ADR CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adr-checks:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check PowerShell version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $PSVersionTable.PSVersion.ToString()
          Write-Host "Runner PowerShell version: $version"
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw 'PowerShell 7 or later is required.'
          }

      - name: Install Pester 5.5.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion '5.5.0' -Scope CurrentUser -Force -AllowClobber
          Import-Module Pester -RequiredVersion '5.5.0' -ErrorAction Stop

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion '5.5.0' -ErrorAction Stop
          $result = Invoke-Pester -Path ./tests -Output Detailed -PassThru
          if ($result.Result -ne 'Passed' -or $result.TotalCount -eq 0 -or $result.FailedCount -gt 0) {
            throw "Pester failed: result=$($result.Result), tests=$($result.TotalCount), failed=$($result.FailedCount)"
          }

      - name: Verify ADR index
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./adr.ps1 -VerifyIndex
